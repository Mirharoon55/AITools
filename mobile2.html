<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Display Terminal - Mobile 2</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    #status {
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
    }
    .status-connected {
      background: #15803d !important;
      color: #fff !important;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
    }
    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    #output {
      flex: 1;
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      font-size: 1.1rem;
      line-height: 1.6;
      border: 1px solid #334155;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>Copilot - Guidance Output</h3>
    <span id="status">Disconnected</span>
  </div>

  <div class="input-group">
    <input type="password" id="apiKey" placeholder="Enter Gemini API Key">
    <button onclick="connectStream()">Connect</button>
  </div>

  <div id="output">Waiting for live feedback from Mobile 1...</div>

  <script>
    let ws;

    function connectStream() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');

      if (!apiKey) {
        alert("Please enter your API Key");
        return;
      }

      statusEl.innerText = "Connecting...";

      // Direct Client-Side WebSocket Connection to Google Live API
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.innerText = "Connected & Listening";
        statusEl.classList.add("status-connected");
        outputEl.innerText = "Connected! Waiting for interviewer questions...\n\n";

        // Receive TEXT modalities ONLY (No media streaming from Mobile 2)
        const setupMessage = {
          setup: {
            model: "models/gemini-1.5-flash",
            generationConfig: {
              responseModalities: ["TEXT"]
            }
          }
        };
        ws.send(JSON.stringify(setupMessage));
      };

      ws.onmessage = (event) => {
        try {
          const response = JSON.parse(event.data);
          
          // Parse and append live model responses
          if (response.serverContent && response.serverContent.modelTurn) {
            const parts = response.serverContent.modelTurn.parts;
            for (let part of parts) {
              if (part.text) {
                outputEl.innerText += part.text;
                outputEl.scrollTop = outputEl.scrollHeight;
              }
            }
          }
        } catch (e) {
          console.error("Error parsing response:", e);
        }
      };

      ws.onerror = (err) => {
        console.error("WebSocket Error:", err);
        statusEl.innerText = "Error";
        statusEl.classList.remove("status-connected");
      };

      ws.onclose = () => {
        statusEl.innerText = "Disconnected";
        statusEl.classList.remove("status-connected");
      };
    }
  </script>
</body>
</html>
