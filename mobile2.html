<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Reader (Mobile 2)</title>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; }
    h3 { color: #38bdf8; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    input, button { padding: 10px; font-size: 14px; margin-bottom: 10px; width: 100%; box-sizing: border-box; border-radius: 6px; border: none; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    #output { background: #1e293b; padding: 15px; border-radius: 8px; min-height: 70vh; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .code-block { background: #000; color: #4ade80; padding: 10px; border-radius: 5px; font-family: monospace; overflow-x: auto; margin: 8px 0; }
    #interrupted { display: none; color: #f87171; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h3>Mobile 2: Real-Time Copilot Output</h3>
  <input type="text" id="apiKey" placeholder="Paste Same Gemini API Key Here">
  <button id="connectBtn">Connect Reader</button>
  <div id="interrupted">⚡ Interviewer Interrupted - Buffer Reset</div>
  <div id="output">Awaiting streaming responses...</div>

  <script>
    let ws;
    const outputDiv = document.getElementById('output');
    const interruptedDiv = document.getElementById('interrupted');

    document.getElementById('connectBtn').onclick = () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert("Please enter your API Key!");

      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        outputDiv.innerHTML = "<em>Connected to Copilot stream. Ready...</em><br><br>";
        
        // Handshake configuration
        ws.send(JSON.stringify({
          setup: {
            model: "models/gemini-2.5-flash",
            generationConfig: { responseModalities: ["TEXT"] }
          }
        }));
      };

      ws.onmessage = (event) => {
        const response = JSON.parse(event.data);

        // Handle barge-in/interruption signal
        if (response.serverContent?.interrupted) {
          interruptedDiv.style.display = "block";
          setTimeout(() => { interruptedDiv.style.display = "none"; }, 2000);
          return;
        }

        // Render streaming text content
        if (response.serverContent?.modelTurn?.parts) {
          response.serverContent.modelTurn.parts.forEach(part => {
            if (part.text) {
              // Basic format for code blocks and line breaks
              let formattedText = part.text
                .replace(/```csharp([\s\S]*?)```/g, '<div class="code-block">$1</div>')
                .replace(/```([\s\S]*?)```/g, '<div class="code-block">$1</div>')
                .replace(/\n/g, '<br>');
              
              outputDiv.innerHTML += formattedText;
              window.scrollTo(0, document.body.scrollHeight);
            }
          });
        }
      };

      ws.onclose = () => { outputDiv.innerHTML += "<br><br>[Disconnected]"; };
    };
  </script>
</body>
</html>
